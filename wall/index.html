<!--
  ============================================================
  index.html — Class Wall
  ============================================================

  This page loads data.json (generated by build.js) and
  displays each student as a card. It's a simple, static page
  with no build tools or frameworks.

  How it works:
    1. On page load, fetch("data.json") is called.
    2. The JSON array of students is looped through.
    3. For each student, a card element is created and
       added to the page.
    4. If the array is empty, a friendly message is shown.

  Improvement ideas (NOT implemented — good-first-issues!):
    - TODO: Add a search box to filter students by name
    - TODO: Colour-code cards based on favourite language
    - TODO: Add a footer with a link back to the repo

  ============================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧱 Class Wall — Git &amp; GitHub Workshop</title>
  <meta name="description" content="A wall of cards showing every student who contributed to the Git & GitHub Workshop.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header id="wall-header">
    <h1>🧱 Class Wall</h1>
    <p class="subtitle">
      Every student who submits a PR gets a card here!
    </p>
  </header>

  <!-- Main content area — cards are injected here by JavaScript -->
  <main id="wall-container">
    <!-- Cards will be rendered here -->
  </main>

  <!-- Empty state — shown when there are no students yet -->
  <div id="empty-state" class="hidden">
    <div class="empty-icon">🎒</div>
    <h2>No students yet!</h2>
    <p>
      Be the first to submit a PR and see your card here.
      Check the <a href="https://github.com/Cyberclutch146/git-github-workshop#-student-workflow-round-1--your-first-pr">README</a>
      for instructions.
    </p>
  </div>

  <!--
    TODO: Add a footer here with a link back to the GitHub repo.
    This is a great good-first-issue for a student to tackle!
    Something like:
      <footer id="wall-footer">
        <p>Made with ❤️ — <a href="https://github.com/Cyberclutch146/git-github-workshop">View on GitHub</a></p>
      </footer>
  -->

  <script>
    /*
     * --------------------------------------------------------
     * Class Wall — Client-side JavaScript
     * --------------------------------------------------------
     * This script fetches student data and creates card
     * elements. No frameworks, no dependencies.
     * --------------------------------------------------------
     */

    // Fetch the student data from data.json
    fetch('data.json')
      .then(function (response) {
        // Check if the request was successful
        if (!response.ok) {
          throw new Error('Could not load data.json');
        }
        return response.json();
      })
      .then(function (students) {
        // Get references to our container elements
        var container = document.getElementById('wall-container');
        var emptyState = document.getElementById('empty-state');

        // If there are no students, show the empty state
        if (!students || students.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        }

        // Create a card for each student
        students.forEach(function (student) {
          var card = createCard(student);
          container.appendChild(card);
        });
      })
      .catch(function (error) {
        // If something goes wrong, show a friendly error
        console.error('Error loading student data:', error);
        var container = document.getElementById('wall-container');
        container.innerHTML =
          '<p class="error-message">⚠️ Could not load student data. ' +
          'Make sure data.json exists.</p>';
      });

    /**
     * Creates a card element for a student.
     *
     * @param {Object} student — { name, github, bio, favourite }
     * @returns {HTMLElement} — the card div
     */
    function createCard(student) {
      // Create the card container
      var card = document.createElement('div');
      card.className = 'student-card';

      /*
       * TODO: Add a CSS class based on student.favourite to
       * colour-code cards by language. For example:
       *   card.classList.add('lang-' + student.favourite.toLowerCase());
       * Then add matching styles in style.css.
       */

      // Student name
      var nameEl = document.createElement('h2');
      nameEl.className = 'card-name';
      nameEl.textContent = student.name;

      // GitHub link
      var linkEl = document.createElement('a');
      linkEl.className = 'card-github';
      linkEl.href = 'https://github.com/' + student.github;
      linkEl.target = '_blank';
      linkEl.rel = 'noopener noreferrer';
      linkEl.textContent = '@' + student.github;

      // Bio
      var bioEl = document.createElement('p');
      bioEl.className = 'card-bio';
      bioEl.textContent = student.bio;

      // Favourite language/tool badge
      var favEl = document.createElement('span');
      favEl.className = 'card-favourite';
      favEl.textContent = student.favourite;

      // Assemble the card
      card.appendChild(nameEl);
      card.appendChild(linkEl);
      card.appendChild(bioEl);
      card.appendChild(favEl);

      return card;
    }

    /*
     * TODO: Add a search box that filters cards in real time.
     * You could add an <input> to the header and listen for
     * the "input" event, then hide/show cards based on whether
     * the student's name or bio includes the search text.
     */
  </script>

</body>
</html>
