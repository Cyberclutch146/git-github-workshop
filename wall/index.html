<!--
  ============================================================
  index.html — Class Wall (School Notebook Edition 📓)
  ============================================================

  A wild notebook-themed page that shows student cards as
  sticky notes taped onto lined notebook paper. Uses
  handwritten Google Fonts and CSS-only doodles.

  ============================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📓 Class Wall — Git &amp; GitHub Workshop</title>
  <meta name="description" content="A notebook-style wall of student cards from the Git & GitHub Workshop.">

  <!-- Handwritten Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&family=Indie+Flower&family=Gloria+Hallelujah&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Spiral binding holes along the top -->
  <div id="spiral-binding" aria-hidden="true">
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
    <span class="spiral-hole"></span>
  </div>

  <!-- Red margin line -->
  <div id="margin-line" aria-hidden="true"></div>

  <!-- Header area — written on the top of the notebook page -->
  <header id="wall-header">
    <div class="header-date">Oct 2026</div>
    <h1>
      <span class="title-doodle">✏️</span>
      Class Wall
      <span class="title-doodle">📓</span>
    </h1>
    <p class="subtitle">
      every student who submits a PR gets a sticky note here!
    </p>
    <div class="doodle-underline" aria-hidden="true"></div>
  </header>

  <!-- Doodle decorations scattered around -->
  <div class="doodle doodle-star" aria-hidden="true">★</div>
  <div class="doodle doodle-arrow" aria-hidden="true">↯</div>
  <div class="doodle doodle-heart" aria-hidden="true">♡</div>
  <div class="doodle doodle-smiley" aria-hidden="true">:)</div>
  <div class="doodle doodle-check" aria-hidden="true">✓</div>

  <!-- Main content — sticky note cards go here -->
  <main id="wall-container">
    <!-- Cards are injected by JavaScript -->
  </main>

  <!-- Empty state -->
  <div id="empty-state" class="hidden">
    <div class="empty-notebook">
      <div class="empty-pencil">✏️</div>
      <h2>This page is blank...</h2>
      <p>
        Be the first to fork the repo, add your file, and open a PR!<br>
        Your sticky note will appear right here.
      </p>
      <div class="empty-arrow">⤴ start here!</div>
    </div>
  </div>

  <!-- Footer scribble -->
  <footer id="wall-footer">
    <p>
      <span class="footer-scribble">~ made with ❤️ and git ~</span>
      <br>
      <a href="https://github.com/Cyberclutch146/git-github-workshop" class="footer-link">
        📎 view on github
      </a>
    </p>
  </footer>

  <script>
    /*
     * --------------------------------------------------------
     * Class Wall — Notebook Edition
     * --------------------------------------------------------
     * Fetches student data and creates sticky-note cards.
     * Each card gets a random pastel colour and slight tilt
     * so it looks like it was stuck on with tape.
     * --------------------------------------------------------
     */

    // Sticky note colour palette — pastel school vibes
    var STICKY_COLOURS = [
      { bg: '#fff9a6', shadow: '#e6df82', tape: '#c4e67e' },  // yellow
      { bg: '#ffb3ba', shadow: '#e09399', tape: '#87ceeb' },  // pink
      { bg: '#baffc9', shadow: '#95d6a4', tape: '#ffb347' },  // green
      { bg: '#bae1ff', shadow: '#95bdd6', tape: '#ff6b6b' },  // blue
      { bg: '#e8baff', shadow: '#c495d6', tape: '#98d8c8' },  // purple
      { bg: '#ffd6a5', shadow: '#d6b082', tape: '#87ceeb' },  // orange
      { bg: '#c9fffe', shadow: '#a5d6d4', tape: '#ffb3ba' },  // mint
      { bg: '#ffffba', shadow: '#d6d695', tape: '#dda0dd' },  // light yellow
    ];

    // Random rotation for that "stuck on paper" look
    function randomTilt() {
      return (Math.random() - 0.5) * 7; // between -3.5 and +3.5 degrees
    }

    // Random sticky colour
    function randomColour() {
      return STICKY_COLOURS[Math.floor(Math.random() * STICKY_COLOURS.length)];
    }

    // Fetch data and render
    fetch('data.json')
      .then(function (response) {
        if (!response.ok) throw new Error('Could not load data.json');
        return response.json();
      })
      .then(function (students) {
        var container = document.getElementById('wall-container');
        var emptyState = document.getElementById('empty-state');

        if (!students || students.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        }

        students.forEach(function (student, index) {
          var card = createStickyNote(student, index);
          container.appendChild(card);
        });
      })
      .catch(function (error) {
        console.error('Error loading student data:', error);
        var container = document.getElementById('wall-container');
        container.innerHTML =
          '<div class="error-note">' +
          '<p>⚠️ Oops! Could not load data.json</p>' +
          '<p class="error-sub">make sure the file exists!</p>' +
          '</div>';
      });

    /**
     * Creates a sticky note card for a student.
     */
    function createStickyNote(student, index) {
      var colour = randomColour();
      var tilt = randomTilt();

      // Outer wrapper with tilt
      var card = document.createElement('div');
      card.className = 'sticky-note';
      card.style.setProperty('--rotate', tilt + 'deg');
      card.style.setProperty('--bg', colour.bg);
      card.style.setProperty('--shadow-color', colour.shadow);
      card.style.setProperty('--tape-color', colour.tape);

      // Tape strip at the top
      var tape = document.createElement('div');
      tape.className = 'tape-strip';
      tape.style.setProperty('--tape-tilt', (Math.random() - 0.5) * 12 + 'deg');

      // Name (big, handwritten)
      var nameEl = document.createElement('h2');
      nameEl.className = 'sticky-name';
      nameEl.textContent = student.name;

      // GitHub handle
      var linkEl = document.createElement('a');
      linkEl.className = 'sticky-github';
      linkEl.href = 'https://github.com/' + student.github;
      linkEl.target = '_blank';
      linkEl.rel = 'noopener noreferrer';
      linkEl.textContent = '@' + student.github;

      // Bio
      var bioEl = document.createElement('p');
      bioEl.className = 'sticky-bio';
      bioEl.textContent = '"' + student.bio + '"';

      // Favourite — drawn like a circled/underlined word
      var favEl = document.createElement('div');
      favEl.className = 'sticky-fav';
      favEl.innerHTML = '❤️ ' + student.favourite;

      // Small doodle in corner
      var doodles = ['⭐', '✦', '♪', '◇', '△', '○', '☺', '✿', '⚡', '🎯'];
      var cornerDoodle = document.createElement('span');
      cornerDoodle.className = 'sticky-doodle';
      cornerDoodle.textContent = doodles[index % doodles.length];

      // Assemble
      card.appendChild(tape);
      card.appendChild(nameEl);
      card.appendChild(linkEl);
      card.appendChild(bioEl);
      card.appendChild(favEl);
      card.appendChild(cornerDoodle);

      return card;
    }
  </script>

</body>
</html>
