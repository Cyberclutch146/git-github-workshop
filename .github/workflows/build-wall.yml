# ============================================================
# build-wall.yml — Build Class Wall Data
# ============================================================
#
# This workflow runs whenever code is pushed to main.
#
# It runs `node wall/build.js` to regenerate wall/data.json
# from the student files, and commits the update if the
# file changed.
#
# Vercel automatically picks up the push and deploys the
# updated wall/ folder — no extra deploy step needed here.
#
# To avoid infinite loops, the commit step uses [skip ci] in
# the commit message and checks whether data.json actually
# changed before committing.
#
# ============================================================

name: 🧱 Build Class Wall Data

on:
  push:
    branches: [main]

# Allow the workflow to commit updated data.json
permissions:
  contents: write

# Only run one build at a time
concurrency:
  group: "build-wall"
  cancel-in-progress: false

jobs:
  build:
    name: Build wall data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build data.json
        run: node wall/build.js

      - name: Check for changes
        id: check
        run: |
          # Check if data.json was modified
          if git diff --quiet wall/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "📋 No changes to data.json — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 data.json has changed — will commit."
          fi

      - name: Commit updated data.json
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wall/data.json
          git commit -m "🤖 Update wall/data.json [skip ci]"
          git push
          # Vercel will auto-deploy from this push

